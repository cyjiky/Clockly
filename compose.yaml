services:
  backend:
    container_name: clockly-backend
    image: clockly-backend
    build: 
      context: ./backend
      dockerfile: Containerfile
    ports:
      - ${BACKEND_PORT}:${BACKEND_PORT}
    volumes:
      - ./backend:/app
    command: 
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
  frontend:
    container_name: clockly-frontend
    image: clockly-frontend
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - ${FRONTEND_PORT}:${FRONTEND_PORT}
    depends_on:
      - backend 
    environment:
      - BACKEND_URL=http://clockly-backend:${BACKEND_PORT}
      # - EXPO_TOKEN=${EXPO_TOKEN}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command:
      # Exclusive (if you use ngrok):
      # sh -c "npm install -g @expo/ngrok && npx expo start --tunnel"
      # npx expo start --lan --clear
      # Exclusive (for local development):
      # npx expo start --web --clear
    stdin_open: true 
    tty: true
  db: 
    container_name: clockly-db
    # hostname: clockly-db
    image: postgres
    env_file:
      - backend/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB} 
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
  db-ui:
    container_name: pgadmin4
    image: docker.io/dpage/pgadmin4:9
    depends_on:
      - db
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      POSTGRES_HOST: clockly-db
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5050:${PGADMING_PORT}